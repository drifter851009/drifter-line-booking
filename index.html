<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DRIFTER 線上預約</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
      text-align: center;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.25;
      margin: 0 0 28px;
    }
    #status {
      font-size: 18px;
      line-height: 1.7;
      white-space: pre-line;
    }
    .muted {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>DRIFTER SPORTS MASSAGE</h1>
    <div id="status">正在確認 LINE 身分…</div>
  </main>

  <script>
    const LIFF_ID = "2011856045-PfCKIOb3";
    const APPSHEET_APP_ID = "47b2ca67-2125-4894-a431-77b02353d24b";
    const APPSHEET_FORM_VIEW = "DRIFTER 線上預約";
    const statusEl = document.getElementById("status");

    function buildAppSheetUrl(userId) {
      const defaults = JSON.stringify({
        "LINE User ID": userId
      });

      return (
        "https://www.appsheet.com/start/" +
        APPSHEET_APP_ID +
        "#control=" +
        encodeURIComponent(APPSHEET_FORM_VIEW) +
        "&defaults=" +
        encodeURIComponent(defaults) +
        "&page=form"
      );
    }

    async function start() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId || "";

        if (!userId) {
          throw new Error("未取得 LINE User ID");
        }

        statusEl.innerHTML =
          "LINE 身分確認成功 ✅<br><span class='muted'>正在進入 DRIFTER 線上預約…</span>";

        const targetUrl = buildAppSheetUrl(userId);

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 500);

      } catch (err) {
        statusEl.innerHTML =
          "LINE 身分取得失敗 ❌<br><span class='muted'>" +
          (err && err.message ? err.message : String(err)) +
          "</span>";
      }
    }

    window.addEventListener("load", start);
  </script>
</body>
</html>
