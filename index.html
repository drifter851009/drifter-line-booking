<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DRIFTER 線上預約</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f6f6f6;
      color: #171717;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
    .brand { text-align: center; padding: 14px 0 24px; }
    .brand h1 { font-size: 25px; margin: 0 0 8px; letter-spacing: .4px; }
    .brand p { color: #666; margin: 0; font-size: 14px; }
    .card { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 2px 14px rgba(0,0,0,.06); }
    label { display: block; font-weight: 650; margin: 18px 0 8px; }
    input, select, textarea {
      width: 100%; border: 1px solid #d8d8d8; border-radius: 12px;
      padding: 14px 13px; font-size: 17px; background: #fff; color: #111;
    }
    textarea { min-height: 92px; resize: vertical; }
    .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .type-btn {
      border: 1px solid #d8d8d8; background: #fff; border-radius: 12px;
      padding: 14px 8px; font-size: 16px;
    }
    .type-btn.active { border: 2px solid #111; font-weight: 700; }
    .type-btn:disabled { opacity: .42; cursor: not-allowed; }
    .type-btn.member { grid-column: 1 / -1; }
    .member-note { color: #555; font-size: 13px; line-height: 1.55; margin-top: 8px; }
    .eligibility-note { color: #666; font-size: 13px; line-height: 1.55; margin-top: 8px; }
    .note { color: #666; font-size: 14px; line-height: 1.65; margin-top: 16px; }
    .status { text-align: center; padding: 42px 12px; line-height: 1.8; }
    .submit {
      width: 100%; margin-top: 22px; border: 0; border-radius: 13px;
      padding: 15px; font-size: 18px; font-weight: 750; background: #111; color: #fff;
    }
    .submit:disabled { opacity: .45; }
    .error { color: #b00020; margin-top: 10px; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>DRIFTER SPORTS MASSAGE</h1>
      <p>線上預約</p>
    </div>

    <div id="loading" class="card status">正在確認 LINE 身分…</div>

    <form id="bookingForm" class="card hidden" method="post">
      <input type="hidden" id="id_token" name="id_token">
      <input type="hidden" id="customer_type" name="customer_type">

      <label for="name">姓名 *</label>
      <input id="name" name="name" autocomplete="name" required>

      <label for="phone">手機 *</label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10"
             placeholder="09xxxxxxxx" autocomplete="tel" required>

      <label for="partner_code">合作優惠碼（若有）</label>
      <input id="partner_code" name="partner_code" type="text" maxlength="32"
             placeholder="請輸入合作方提供的優惠碼" autocapitalize="characters" autocomplete="off">
      <div id="partnerCodeNote" class="eligibility-note">合作優惠碼不可與第一次體驗價併用。</div>

      <label>預約身份 *</label>
      <div class="types">
        <button id="firstExperienceBtn" type="button" class="type-btn" data-value="第一次體驗" disabled>第一次體驗</button>
        <button id="singleBtn" type="button" class="type-btn" data-value="單次">單次</button>
        <button id="memberBtn" type="button" class="type-btn member hidden" data-value="會員預約" disabled>會員預約</button>
      </div>
      <div id="firstExperienceNote" class="eligibility-note">正在確認第一次體驗資格…</div>
      <div id="memberNote" class="member-note hidden"></div>

      <label for="date">預約日期 *</label>
      <input id="date" name="date" type="date" required>

      <label for="time">預約時間 *</label>
      <select id="time" name="time" required disabled>
        <option value="">請先選擇日期</option>
      </select>

      <label for="notes">希望處理部位／其他備註</label>
      <textarea id="notes" name="notes"></textarea>

      <div class="note">
        本次預約基礎服務時間為 60 分鐘；是否延長由按摩師現場評估。<br>
        僅顯示目前可預約時段。
      </div>

      <div id="formError" class="error"></div>
      <button id="submitBtn" class="submit" type="submit">確認預約</button>
    </form>
  </div>

<script>
  const LIFF_ID = '2011856045-PfCKIOb3';

  // 重要：把下一行換成你 Apps Script 部署後的 /exec 網址
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwVJ_6J2b54Jmy8o8rdvSVtXREyNbiGfKVHtyAPD0qoSYJnfPT8JOY0_WwHSZeQQMUZmA/exec';

  const loading = document.getElementById('loading');
  const form = document.getElementById('bookingForm');
  const dateInput = document.getElementById('date');
  const timeSelect = document.getElementById('time');
  const typeInput = document.getElementById('customer_type');
  const tokenInput = document.getElementById('id_token');
  const formError = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  const firstExperienceBtn = document.getElementById('firstExperienceBtn');
  const firstExperienceNote = document.getElementById('firstExperienceNote');
  const memberBtn = document.getElementById('memberBtn');
  const memberNote = document.getElementById('memberNote');
  const phoneInput = document.getElementById('phone');
  const partnerCodeInput = document.getElementById('partner_code');
  const partnerCodeNote = document.getElementById('partnerCodeNote');
  let currentLineKey = '';
  let lastEligibilityPhone = '';
  let lineFirstEligibility = null;
  let phoneFirstEligibility = null;
  let phoneFirstReason = '';
  let activePartnerOffer = null;
  let partnerCodeValidationSeq = 0;
  let partnerCodeTimer = null;

  function todayLocal() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  async function sha256Hex(value) {
    const data = new TextEncoder().encode(value);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function normalizePartnerCode(value) {
    return String(value || '').trim().toUpperCase().replace(/\s+/g, '');
  }

  function refreshFirstExperienceState() {
    if (activePartnerOffer) {
      firstExperienceBtn.disabled = true;
      firstExperienceBtn.textContent = '第一次體驗（合作優惠不適用）';
      firstExperienceBtn.classList.remove('active');
      if (typeInput.value === '第一次體驗') setSelectedType('');
      firstExperienceNote.textContent = '已套用合作優惠；合作優惠與第一次體驗價不可併用，請選擇「單次」或「會員預約」。';
      return;
    }

    const known = lineFirstEligibility !== null || phoneFirstEligibility !== null;
    if (!known) {
      firstExperienceBtn.disabled = true;
      firstExperienceBtn.textContent = '第一次體驗';
      firstExperienceNote.textContent = '正在確認第一次體驗資格…';
      return;
    }

    const eligible = lineFirstEligibility !== false && phoneFirstEligibility !== false;
    firstExperienceBtn.disabled = !eligible;

    if (eligible) {
      firstExperienceBtn.textContent = '第一次體驗';
      firstExperienceNote.textContent = '第一次體驗每位客戶限一次。';
    } else {
      firstExperienceBtn.textContent = '第一次體驗（不適用）';
      firstExperienceBtn.classList.remove('active');
      if (typeInput.value === '第一次體驗') setSelectedType('');

      if (phoneFirstReason === 'member') {
        firstExperienceNote.textContent = '系統已辨識為既有會員，第一次體驗不可再次使用。';
      } else if (phoneFirstReason === 'phone') {
        firstExperienceNote.textContent = '此手機號碼已使用過第一次體驗，請選擇「單次」。';
      } else if (phoneFirstReason === 'line' || lineFirstEligibility === false) {
        firstExperienceNote.textContent = '此 LINE 帳號已使用過第一次體驗，請選擇「單次」。';
      } else {
        firstExperienceNote.textContent = '第一次體驗資格不適用，請選擇「單次」。';
      }
    }
  }

  function setSelectedType(value) {
    document.querySelectorAll('.type-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.value === value);
    });
    typeInput.value = value || '';
  }

  function resetMemberState() {
    memberBtn.disabled = true;
    memberBtn.classList.add('hidden');
    memberBtn.textContent = '會員預約';
    memberNote.classList.add('hidden');
    memberNote.textContent = '';
    phoneFirstEligibility = null;
    phoneFirstReason = '';
    if (typeInput.value === '會員預約') setSelectedType('');
    refreshFirstExperienceState();
  }

  function applyBookingEligibility(data) {
    const ok = !!(data && data.ok);
    if (!ok) return;

    phoneFirstEligibility = !!data.firstExperienceEligible;
    phoneFirstReason = String(data.firstExperienceReason || '');
    refreshFirstExperienceState();

    const memberFound = !!data.memberFound;
    const memberEligible = !!data.memberEligible;
    const remaining = Number(data.remainingSessions || 0);

    if (memberEligible) {
      memberBtn.disabled = false;
      memberBtn.classList.remove('hidden');
      memberBtn.textContent = `會員預約｜剩餘 ${remaining} 堂`;
      memberNote.classList.remove('hidden');
      memberNote.textContent = '已辨識為堂數會員；本次預約不會先扣堂，服務完成後才扣除。';

      // 既有堂數會員預設帶入「會員預約」，仍可手動改選單次。
      if (!typeInput.value || typeInput.value === '第一次體驗') {
        setSelectedType('會員預約');
      }
    } else {
      memberBtn.disabled = true;
      memberBtn.classList.add('hidden');
      memberBtn.textContent = '會員預約';
      if (typeInput.value === '會員預約') setSelectedType('');

      if (memberFound) {
        memberNote.classList.remove('hidden');
        memberNote.textContent = '已找到會員資料，但目前沒有可使用堂數；請選擇「單次」。';
      } else {
        memberNote.classList.add('hidden');
        memberNote.textContent = '';
      }
    }
  }

  async function loadBookingEligibilityForPhone(phone) {
    const normalized = String(phone || '').replace(/\D/g, '');
    if (!/^09\d{8}$/.test(normalized) || !currentLineKey) {
      resetMemberState();
      return;
    }

    if (lastEligibilityPhone === normalized) return;
    lastEligibilityPhone = normalized;

    const phoneKey = await sha256Hex(normalized);
    const callbackName = 'drifterBookingEligibility_' + Date.now();

    window[callbackName] = function(data) {
      delete window[callbackName];
      script.remove();
      applyBookingEligibility(data);
    };

    const script = document.createElement('script');
    script.onerror = function() {
      delete window[callbackName];
      script.remove();
      resetMemberState();
      memberNote.classList.remove('hidden');
      memberNote.textContent = '會員資格讀取失敗；送出預約時系統仍會再次確認。';
    };
    script.src = `${BACKEND_URL}?action=bookingEligibility&lineKey=${encodeURIComponent(currentLineKey)}&phoneKey=${encodeURIComponent(phoneKey)}&callback=${callbackName}`;
    document.body.appendChild(script);
  }

  function loadFirstExperienceEligibility(lineKey) {
    const callbackName = 'drifterFirstExp_' + Date.now();

    window[callbackName] = function(data) {
      delete window[callbackName];
      script.remove();

      lineFirstEligibility = !!(data && data.ok && data.eligible);
      refreshFirstExperienceState();
    };

    const script = document.createElement('script');
    script.onerror = function() {
      delete window[callbackName];
      script.remove();
      // 查詢失敗時保持中立；送出時後端仍會再次權威驗證。
      lineFirstEligibility = null;
      refreshFirstExperienceState();
      if (!activePartnerOffer) {
        firstExperienceBtn.disabled = false;
        firstExperienceNote.textContent = '第一次體驗資格將於送出預約時再次確認。';
      }
    };
    script.src = `${BACKEND_URL}?action=firstExperienceEligibility&lineKey=${encodeURIComponent(lineKey)}&callback=${callbackName}`;
    document.body.appendChild(script);
  }

  function loadPartnerCodeEligibility(code) {
    const normalized = normalizePartnerCode(code);
    partnerCodeInput.value = normalized;

    if (!normalized) {
      activePartnerOffer = null;
      partnerCodeNote.textContent = '合作優惠碼不可與第一次體驗價併用。';
      refreshFirstExperienceState();
      return;
    }

    const seq = ++partnerCodeValidationSeq;
    activePartnerOffer = null;
    partnerCodeNote.textContent = '正在確認合作優惠碼…';
    refreshFirstExperienceState();

    const callbackName = 'drifterPartnerCode_' + Date.now();

    window[callbackName] = function(data) {
      delete window[callbackName];
      script.remove();
      if (seq !== partnerCodeValidationSeq) return;

      const currentCode = normalizePartnerCode(partnerCodeInput.value);
      const valid = !!(data && data.ok && data.valid && data.code === currentCode);

      if (valid) {
        activePartnerOffer = {
          code: data.code,
          offerId: data.offerId || '',
          partnerName: data.partnerName || '合作優惠',
          singleDiscount: Number(data.singleDiscount || 0),
          packageDiscount: Number(data.packageDiscount || 0)
        };

        partnerCodeNote.textContent =
          `已套用：${activePartnerOffer.partnerName}｜單次折 NT$${activePartnerOffer.singleDiscount.toLocaleString()}｜` +
          `堂數購買折 NT$${activePartnerOffer.packageDiscount.toLocaleString()}。不適用第一次體驗價。`;
      } else {
        activePartnerOffer = null;
        partnerCodeNote.textContent = '查無有效的合作優惠碼，請確認後重新輸入。';
      }
      refreshFirstExperienceState();
    };

    const script = document.createElement('script');
    script.onerror = function() {
      delete window[callbackName];
      script.remove();
      if (seq !== partnerCodeValidationSeq) return;
      activePartnerOffer = null;
      partnerCodeNote.textContent = '優惠碼確認失敗；請稍後再試。';
      refreshFirstExperienceState();
    };
    script.src = `${BACKEND_URL}?action=partnerCodeEligibility&code=${encodeURIComponent(normalized)}&callback=${callbackName}`;
    document.body.appendChild(script);
  }

  function loadAvailability(date) {
    timeSelect.disabled = true;
    timeSelect.innerHTML = '<option value="">讀取可預約時段中…</option>';

    const callbackName = 'drifterAvail_' + Date.now();
    window[callbackName] = function(data) {
      delete window[callbackName];
      script.remove();

      const times = data && data.ok && Array.isArray(data.times) ? data.times : [];
      if (!times.length) {
        timeSelect.innerHTML = '<option value="">當日目前無可預約時段</option>';
        timeSelect.disabled = true;
        return;
      }

      timeSelect.innerHTML = '<option value="">請選擇時間</option>' +
        times.map(t => `<option value="${t}">${t}</option>`).join('');
      timeSelect.disabled = false;
    };

    const script = document.createElement('script');
    script.onerror = function() {
      delete window[callbackName];
      timeSelect.innerHTML = '<option value="">讀取時段失敗，請重新整理</option>';
    };
    script.src = `${BACKEND_URL}?action=availability&date=${encodeURIComponent(date)}&callback=${callbackName}`;
    document.body.appendChild(script);
  }

  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      setSelectedType(btn.dataset.value);
      formError.textContent = '';
    });
  });

  partnerCodeInput.addEventListener('input', () => {
    const normalized = normalizePartnerCode(partnerCodeInput.value);
    partnerCodeInput.value = normalized;
    activePartnerOffer = null;
    partnerCodeValidationSeq++;
    clearTimeout(partnerCodeTimer);

    if (!normalized) {
      partnerCodeNote.textContent = '合作優惠碼不可與第一次體驗價併用。';
      refreshFirstExperienceState();
      return;
    }

    partnerCodeNote.textContent = '輸入完成後將自動確認優惠碼。';
    refreshFirstExperienceState();
    partnerCodeTimer = setTimeout(() => loadPartnerCodeEligibility(normalized), 550);
  });

  partnerCodeInput.addEventListener('blur', () => {
    clearTimeout(partnerCodeTimer);
    loadPartnerCodeEligibility(partnerCodeInput.value);
  });

  phoneInput.addEventListener('input', () => {
    const normalized = phoneInput.value.replace(/\D/g, '');
    if (!/^09\d{8}$/.test(normalized)) {
      lastEligibilityPhone = '';
      resetMemberState();
      return;
    }
    loadBookingEligibilityForPhone(normalized);
  });

  phoneInput.addEventListener('blur', () => {
    loadBookingEligibilityForPhone(phoneInput.value);
  });

  dateInput.addEventListener('change', () => {
    if (dateInput.value) loadAvailability(dateInput.value);
  });

  form.addEventListener('submit', (e) => {
    formError.textContent = '';
    const phone = document.getElementById('phone').value.replace(/\D/g,'');
    const partnerCode = normalizePartnerCode(partnerCodeInput.value);

    if (partnerCode && (!activePartnerOffer || activePartnerOffer.code !== partnerCode)) {
      e.preventDefault();
      formError.textContent = '合作優惠碼尚未通過驗證，請確認優惠碼後再送出。';
      return;
    }
    if (partnerCode && typeInput.value === '第一次體驗') {
      e.preventDefault();
      formError.textContent = '合作優惠不適用第一次體驗價，請改選「單次」。';
      return;
    }

    if (!typeInput.value) {
      e.preventDefault();
      formError.textContent = '請選擇預約身份。';
      return;
    }
    if (!/^09\d{8}$/.test(phone)) {
      e.preventDefault();
      formError.textContent = '請輸入 09 開頭的 10 碼手機號碼。';
      return;
    }
    if (!timeSelect.value) {
      e.preventDefault();
      formError.textContent = '請選擇預約時間。';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '送出預約中…';
  });

  async function init() {
    try {
      if (!BACKEND_URL.startsWith('https://script.google.com/macros/s/')) {
        throw new Error('尚未設定後端網址');
      }

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
        return;
      }

      const idToken = liff.getIDToken();
      if (!idToken) throw new Error('無法取得 LINE 登入憑證');

      const profile = await liff.getProfile();
      const lineUserId = profile && profile.userId ? profile.userId : '';

      tokenInput.value = idToken;
      form.action = BACKEND_URL;
      dateInput.min = todayLocal();

      if (lineUserId && window.crypto && crypto.subtle) {
        currentLineKey = await sha256Hex(lineUserId);
        loadFirstExperienceEligibility(currentLineKey);
        if (/^09\d{8}$/.test(phoneInput.value.replace(/\D/g, ''))) {
          loadBookingEligibilityForPhone(phoneInput.value);
        }
      } else {
        lineFirstEligibility = null;
        refreshFirstExperienceState();
        if (!activePartnerOffer) {
          firstExperienceBtn.disabled = false;
          firstExperienceNote.textContent = '第一次體驗資格將於送出預約時確認。';
        }
      }

      loading.classList.add('hidden');
      form.classList.remove('hidden');
    } catch (err) {
      loading.innerHTML = '無法開啟預約系統<br><small>' +
        (err && err.message ? err.message : String(err)) +
        '</small>';
    }
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
