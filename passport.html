<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,nosnippet"><meta http-equiv="Cache-Control" content="no-store,no-cache,max-age=0">
<title>DRIFTER｜我的 Body Passport</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f1;color:#171717;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:590px;margin:0 auto;padding:42px 20px 72px}.head{border-bottom:2px solid #171717;margin-bottom:30px;padding-bottom:24px}.brand{font-weight:900;font-size:15px;letter-spacing:4px}.title{font-weight:900;font-size:31px;margin:10px 0 7px;line-height:1.3}.sub{color:#6c6864}.panel{background:white;border:1px solid #e2dfda;border-radius:16px;padding:22px;margin:16px 0}label{display:block;font-weight:750;margin-top:20px;margin-bottom:8px}input{width:100%;padding:13px 15px;border:1px solid #d2cfca;border-radius:10px;font-size:17px;letter-spacing:1px;text-transform:uppercase}button{background:#111;color:#fff;font-weight:750;font-size:16px;border:0;border-radius:11px;padding:15px;width:100%;margin:18px 0 0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#777;font-size:13px}#status{margin:12px 0;font-size:14px;min-height:20px}.err{color:#b13737}.hidden{display:none}.safe{font-size:13px;color:#706b65;border-left:3px solid #888;padding:8px 12px;margin-top:20px}
</style>
</head>
<body><main>
<div class="head"><div class="brand">DRIFTER</div><h1 class="title">我的 Body Passport</h1><div class="sub">會員個人身體護照 · 僅限本人瀏覽</div></div>
<div class="panel"><div class="sub">安全連線</div><div id="status">正在確認 LINE 會員身分與後端版本…</div>
<form id="passportForm" class="hidden" method="POST" enctype="application/x-www-form-urlencoded" action="https://script.google.com/macros/s/AKfycbwVJ_6J2b54Jmy8o8rdvSVtXREyNbiGfKVHtyAPD0qoSYJnfPT8JOY0_WwHSZeQQMUZmA/exec">
<input type="hidden" name="action" value="passport_view"><input type="hidden" name="id_token" id="idToken">
<label for="activationCode">會員啟用碼（首次啟用才需要）</label>
<input id="activationCode" name="activation_code" maxlength="28" placeholder="若已綁定可留空" autocomplete="off" autocapitalize="characters" spellcheck="false">
<p class="muted">首次使用請向 DRIFTER 索取本人專屬的一次性啟用碼。未完成綁定的 LINE 帳號無法查看健康紀錄。</p>
<button id="submitBtn" type="submit">驗證身分並查看我的護照</button>
</form><div class="safe">本頁不會向其他會員公開你的資料。服務摘要僅顯示工作室已核准的內容。</div></div>
</main>
<script>
(function(){'use strict';
  var API='https://script.google.com/macros/s/AKfycbwVJ_6J2b54Jmy8o8rdvSVtXREyNbiGfKVHtyAPD0qoSYJnfPT8JOY0_WwHSZeQQMUZmA/exec';
  var LIFF='2011856045-PfCKIOb3',VER='BP-READONLY-2026-10';
  var status=document.getElementById('status'),form=document.getElementById('passportForm'),btn=document.getElementById('submitBtn');
  function fail(s){status.textContent=s;status.classList.add('err');form.classList.add('hidden');}
  function backendReady(){return new Promise(function(resolve){
    var cb='drifterPassportViewerReady'+String(Date.now());var script=document.createElement('script');var ended=false;
    function done(ok){if(ended)return;ended=true;delete window[cb];script.remove();resolve(ok)}
    window[cb]=function(d){done(!!d&&d.ok===true&&d.passportViewerVersion===VER)};
    script.onerror=function(){done(false)};
    script.src=API+'?action=health&callback='+cb+'&_='+Date.now();document.head.appendChild(script);
    setTimeout(function(){done(false)},9000);
  })}
  async function boot(){try{
    if(!await backendReady()){fail('會員護照正在準備中，請稍後再試。原本的 LINE 線上預約不受影響。');return}
    if(typeof liff==='undefined')throw new Error('LINE 元件無法載入，請從 LINE 官方帳號重新開啟。');
    await liff.init({liffId:LIFF});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
    var token=liff.getIDToken();if(!token)throw new Error('無法取得 LINE 驗證資料，請重新從 LINE 開啟。');
    document.getElementById('idToken').value=token;
    status.textContent='LINE 已登入，伺服器將再次驗證身分。';form.classList.remove('hidden');
  }catch(e){fail(e&&e.message?e.message:'無法開啟，請重新從 LINE 進入。')}}
  form.addEventListener('submit',function(e){if(!document.getElementById('idToken').value){e.preventDefault();fail('LINE 身分資料遺失，請重新開啟。');return}btn.disabled=true;btn.textContent='正在安全讀取…';});
  boot();
})();
</script>
</body></html>
